main = ".open-next/worker.js"
name = "jing-blog"
compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[build]
command = "npm run build:cf"

[vars]
NEXT_PUBLIC_SITE_URL = "https://jing-blog.15717985489.workers.dev"

[observability]
[observability.logs]
enabled = true
# 头部采样率，1 表示 100% 采样（所有请求都会被采样）
head_sampling_rate = 1
# 启用调用日志（记录每次函数调用）
invocation_logs = true
# 持久化日志到磁盘（本地开发时有用）
persist = true
